# ====================================================================
# GITOPS CONFIGURATION PIPELINE: PURE DYNAMIC PROXMOX PLUGINS WORKFLOW
# ====================================================================

stages:
  - configure

variables:
  ANSIBLE_IMAGE: "docker.io/alpine/ansible:2.21.0"
  VAULT_PASS_FILE: "/var/lib/gitlab-runner/secure-vars/vault-password.txt"
  RUNNER_SSH_KEY: "/var/lib/gitlab-runner/secure-vars/priv_key_secops"
  #Path to the local secure variables holding Proxmox API access credentials
  SECURE_ENV: "/var/lib/gitlab-runner/secure-vars/production.tfvars"
  


ansible_configure:
  stage: configure
  tags:
    - image-builder # Targets the dedicated internal RHEL Runner node
  before_script:
    - |
      if [ ! -f "${VAULT_PASS_FILE}" ]; then
        echo "CRITICAL ERROR: Ansible Vault password file ${VAULT_PASS_FILE} missing on Runner disk!"
        exit 1
      fi
      if [ ! -f "${RUNNER_SSH_KEY}" ]; then
        echo "CRITICAL ERROR: Private SSH Key ${RUNNER_SSH_KEY} missing on Runner disk!"
        exit 1
      fi
      if [ ! -f "${SECURE_ENV}" ]; then 
        echo "Source secure environment file missing!"
        exit 1 
      fi
  script:
    - 'echo "=== 1. STARTING SECURE SSH AGENT AND LOADING KEY IN RAM ==="'
    - eval $(ssh-agent -s)
    - chmod 600 "${RUNNER_SSH_KEY}"
    - ssh-add "${RUNNER_SSH_KEY}"
    
    - 'echo "=== 2. LAUNCHING CONTAINERIZED ANSIBLE CONFIGURATION VIA SOCKET ==="'
    # Executing rootless: container never sees the physical key, communicates via RAM UNIX 
    # Pass the token variables file directly via --env-file to feed the Proxmox Python SDK inside the container
    - |
       podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z,U \
        -v "${VAULT_PASS_FILE}":/vault-password.txt:ro \
        -v "${SSH_AUTH_SOCK}":/ssh-agent.sock \
        --env-file "${SECURE_ENV}" \
        -e SSH_AUTH_SOCK=/ssh-agent.sock \
        -e ANSIBLE_HOST_KEY_CHECKING=False \
        -e PROXMOX_INVALID_CERT_OK=True \
        --security-opt label=disable \
        -w /workspace \
        ${ANSIBLE_IMAGE} \
        /bin/sh -c "
          echo '=== Installing native Python Proxmox SDK dependencies inside transient container ===' &&
          pip3 install --no-cache-dir requests proxmoxer &&
          ansible-galaxy collection install community.proxmox &&
          ansible-playbook -i inventory/proxmox.yml site.yml --vault-password-file /vault-password.txt
        "
  after_script:
    - 'echo "=== CLEANUP: Restoring workspace files permissions to gitlab-runner ==="'
    - podman unshare chown -R gitlab-runner:gitlab-runner "${CI_PROJECT_DIR}"
  artifacts:
    name: "openbao-credentials-${CI_COMMIT_SHORT_SHA}"
    paths:
      # SECURE EXTRACTION: Offload this dynamic credentials mapping file right after green build
      - openbao-credentials.json
    expire_in: 2 hours # Tight enforcement boundary for security compliance limits
  only:
    - main
