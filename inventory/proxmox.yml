---
plugin: community.proxmox.proxmox
want_dns_info: false
want_guest_agent: true
validate_certs: false
want_facts: true

url: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PROXMOX_URL') }}"
user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PROXMOX_USER') }}"
token_id: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PROXMOX_TOKEN_SECRET') }}"

# Dynamic object splitting pattern targeting native dictionary mapping keys
compose:
  ansible_host: proxmox_ipconfig0.ip.split('/') | first

strict: false
keyed_groups:
  - prefix: ""
    key: name
    separator: ""
